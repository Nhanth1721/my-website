<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trần Hiếu Nhân - Portfolio</title>
    <link rel="stylesheet" href="css/style.css">
  
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <header class="header">
        <nav class="navbar container">
            <a href="#" class="logo">Hiếu Nhân</a>
            <ul class="nav-links">
                <li><a href="#about">Giới thiệu</a></li>
                <li><a href="#skills">Kỹ năng</a></li>
                <li><a href="#projects">Dự án</a></li>
                <li><button id="theme-toggle" aria-label="Đổi giao diện"><i data-lucide="moon"></i></button></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section id="about" class="section">
            <article class="about-content">
                <h1>Trần Hiếu Nhân </h1>
                <p>Sinh viên CNTT tại ĐH Gia Định. Đam mê Lập trình Web.</p>
            </article>
        </section>

        <!-- Container để JS cơ bản chèn bảng -->
        <section id="skills" class="section">
            <h2>Kỹ năng nổi bật</h2>
            <div id="skills-container"></div> 
        </section>

        <!-- Container để JS nâng cao (Fetch API) chèn Grid -->
        <section id="projects" class="section">
            <h2>Dự án thực tế</h2>
            <div id="projects-grid" class="projects-grid"></div>
        </section>

        <!-- Form HTML5 với pattern validation -->
        <section id="contact" class="section">
            <h2>Liên hệ</h2>
            <form id="contact-form" class="contact-form" novalidate>
                <div class="form-group">
                    <label for="fullname">Họ tên: *</label>
                    <input type="text" id="fullname" required pattern=".{3,}">
                </div>
                <div class="form-group">
                    <label for="email">Email: *</label>
                    <input type="email" id="email" required>
                </div>
                <button type="submit" class="btn-submit">Gửi thông tin</button>
            </form>
        </section>
    </main>

    <footer class="footer">
        <address class="container"><p>&copy; 2026 Hiếu Nhân - 25150620</p></address>
    </footer>
    <script src="js/script.js" defer></script>
</body>
</html>
